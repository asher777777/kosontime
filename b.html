<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOSUN - Dynamic Questionnaire System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --brand-cyan: #00F0FF;
            --brand-white: #F0F4FF;
            --brand-bg-dark: #0D0E1F;
            --brand-glow: 0 0 25px rgba(0, 240, 255, 0.45);
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--brand-bg-dark);
            background-image:
                radial-gradient(circle at 50% 10%, rgba(26, 102, 255, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 50% 90%, rgba(0, 240, 255, 0.12) 0%, transparent 60%);
            color: var(--brand-white);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            /* מניעת גלילה מוחלטת */
            user-select: none;
        }

        /* הילה זוהרת לטקסט */
        .glow-text {
            text-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
        }

        /* אנימציית נשימה ופעימה ל-K בתחתית */
        @keyframes kPulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
                border-color: rgba(0, 240, 255, 0.7);
            }

            50% {
                transform: scale(1.08);
                box-shadow: 0 0 35px rgba(0, 240, 255, 0.85);
                border-color: #00F0FF;
            }
        }

        .k-beacon {
            animation: kPulse 2.4s ease-in-out infinite;
        }

        /* מתיחת התשובה כלפי מעלה והיצמדות להירו */
        .stretch-clone {
            position: fixed;
            z-index: 100;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.85);
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.3), rgba(26, 102, 255, 0.4));
            border-color: #00F0FF;
        }

        /* חיתוך שורה אחת בלבד */
        .truncate-single {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

<body class="flex flex-col justify-between items-center p-4 max-w-md mx-auto relative">

    <!-- ========================================== -->
    <!-- אזור עליון: סרגל ניווט וכפתור "עד כאן להיום" -->
    <!-- ========================================== -->
    <header class="w-full flex items-center justify-between pt-2 pb-1 z-10">
        <!-- אינדיקטור שלב -->
        <div class="flex items-center gap-2">
            <span id="stepBadge"
                class="text-xs px-2.5 py-1 rounded-full border border-cyan-400/40 bg-cyan-950/40 text-cyan-300 font-semibold tracking-wider">
                שלב 1 מתוך 3
            </span>
        </div>

        <!-- כפתור סיום המופיע בכל שלב -->
        <button onclick="triggerExitPrompt()"
            class="text-xs sm:text-sm font-semibold tracking-wide px-3.5 py-1.5 rounded-full border border-white/20 bg-white/5 hover:border-cyan-400 hover:text-cyan-300 transition-all flex items-center gap-1.5">
            <span>עד כאן להיום</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                </path>
            </svg>
        </button>
    </header>

    <!-- ========================================== -->
    <!-- אזור ההירו: כותרת השאלה (יעד המתיחה)        -->
    <!-- ========================================== -->
    <div id="heroContainer"
        class="w-full text-center my-auto transition-all duration-300 min-h-[90px] flex flex-col justify-center items-center">
        <!-- תווית עזר למעצב: כאן מתעדכנת כותרת השאלה -->
        <span id="heroSub" class="text-xs font-semibold tracking-widest text-cyan-400 uppercase mb-1">
            [כאן קטגוריה / תת-כותרת]
        </span>
        <h1 id="heroQuestion" class="text-2xl sm:text-3xl font-bold leading-tight glow-text text-white px-2">
            כאן שאלה א' (כותרת בהירו)
        </h1>
    </div>

    <!-- ========================================== -->
    <!-- מרכז: אזור התשובות הדינמיות / שדה פתוח     -->
    <!-- ========================================== -->
    <main id="optionsContainer" class="w-full flex flex-col gap-3.5 mb-auto z-10 transition-opacity duration-300">
        <!-- התוכן נוצר דינמית ע"י JavaScript למטה -->
    </main>

    <!-- ========================================== -->
    <!-- תחתית: ה-K המהבהבת המפעילה את ה-AI         -->
    <!-- ========================================== -->
    <footer class="w-full flex flex-col items-center pb-2 z-10">
        <!-- כפתור K מהבהב עם Placeholder מובנה ל-SVG -->
        <button onclick="toggleAiDrawer()"
            class="k-beacon flex items-center justify-center w-14 h-14 rounded-2xl bg-[#0D0E1F]/90 border-2 border-cyan-400 text-cyan-400 backdrop-blur-md shadow-lg active:scale-95 transition-transform"
            title="עזרת AI">

            <!-- ========================================== -->
            <!-- ⚡ PLACEHOLDER FOR K SVG ICON START ⚡    -->
            <!-- הדבק כאן את ה-SVG המדויק של האות K שלכם -->
            <!-- ========================================== -->
            <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- עמוד שמאל של ה-K -->
                <rect x="20" y="15" width="16" height="70" rx="8" fill="#F0F4FF" />
                <!-- אלכסון עליון של ה-K -->
                <path d="M40 50L68 22C72 18 78 18 82 22C86 26 86 32 82 36L56 62L40 50Z" fill="#F0F4FF" />
                <!-- אלכסון תחתון תכלת של ה-K -->
                <path d="M35 45L68 78C72 82 78 82 82 78C86 74 86 68 82 64L51 33L35 45Z" fill="#00F0FF" />
            </svg>
            <!-- ⚡ PLACEHOLDER FOR K SVG ICON END ⚡ -->

        </button>
        <span class="text-[11px] text-cyan-300/80 mt-1.5 font-medium tracking-wide">
            שאל את KOSUN AI
        </span>
    </footer>

    <!-- ========================================== -->
    <!-- מגירת עזרה (AI Drawer)                     -->
    <!-- ========================================== -->
    <div id="aiDrawer"
        class="fixed inset-x-0 bottom-0 bg-[#0D0E1F]/95 border-t border-cyan-400/40 rounded-t-3xl p-5 z-50 transform translate-y-full transition-transform duration-300 backdrop-blur-xl shadow-2xl max-w-md mx-auto">
        <div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-4"></div>
        <div class="flex items-center justify-between mb-2">
            <h3 class="text-base font-bold text-cyan-300 flex items-center gap-2">
                <span>🤖</span> עזרת KOSUN AI לשלב זה
            </h3>
            <button onclick="toggleAiDrawer()" class="text-white/60 hover:text-white text-sm">סגור ✕</button>
        </div>
        <p id="aiHintText" class="text-sm text-white/80 leading-relaxed mb-4">
            [כאן מופיע הסבר הכוונה חכם של ה-AI לשאלה הנוכחית כדי למנוע נטישה].
        </p>
        <button onclick="toggleAiDrawer()"
            class="w-full py-2.5 rounded-xl bg-cyan-400/20 border border-cyan-400 text-cyan-300 font-semibold text-sm hover:bg-cyan-400/30">
            הבנתי, בוא נמשיך
        </button>
    </div>

    <!-- ========================================== -->
    <!-- מודל "עד כאן להיום"                        -->
    <!-- ========================================== -->
    <div id="exitModal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0D0E1F] border border-cyan-400/30 rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl">
            <div
                class="w-12 h-12 rounded-2xl bg-cyan-400/10 border border-cyan-400/40 flex items-center justify-center text-cyan-300 mx-auto mb-3">
                💾
            </div>
            <h4 class="text-lg font-bold text-white mb-1">ההתקדמות נשמרה כנכס!</h4>
            <p class="text-xs text-white/70 mb-5 leading-relaxed">
                תוכל לחזור ולהמשיך בדיוק מהנקודה שבה עצרת.
            </p>
            <div class="flex flex-col gap-2">
                <button onclick="closeExitModal()"
                    class="w-full py-2.5 rounded-xl bg-cyan-400 text-slate-950 font-bold text-sm shadow-md hover:brightness-110">
                    המשך בשאלון
                </button>
                <button onclick="location.reload()"
                    class="w-full py-2.5 rounded-xl border border-white/20 text-white/80 font-medium text-xs hover:bg-white/5">
                    יציאה ל-kosun.pro
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- לוגיקה דינמית והנפשת המתיחה                 -->
    <!-- ========================================== -->
    <script>
        /**
         * מערך השאלות הדינמי - מדריך למעצב ולמפתח
         * כולל: שאלות אמריקאיות ושדה פתוח
         */
        const questionnaireData = [
            {
                id: 1,
                category: "שלב אפיון",
                heroTitle: "כאן שאלה א' (כותרת בהירו)",
                type: "options", // שאלת בחירה
                aiHint: "טיפ מ-AI עבור שאלה א': בחר באפשרות שמשקפת את הפעילות העיקרית שלך.",
                answers: [
                    { id: 'a1', text: "כאן תשובה 1 (שורה אחת ברורה)", icon: "🎯" },
                    { id: 'a2', text: "כאן תשובה 2 (שורה אחת ברורה)", icon: "⚡" },
                    { id: 'a3', text: "כאן תשובה 3 (שורה אחת ברורה)", icon: "🚀" },
                    { id: 'a4', text: "כאן תשובה 4 (שורה אחת ברורה)", icon: "💎" }
                ]
            },
            {
                id: 2,
                category: "שלב הזנת תוכן",
                heroTitle: "כאן שאלה ב' (שדה פתוח בהירו)",
                type: "open_field", // שדה פתוח
                placeholder: "הקלד כאן את המידע שלך בשורה אחת...",
                aiHint: "טיפ מ-AI עבור השדה הפתוח: הקלד בקיצור את שם הפרויקט או ההגדרה שנרשום כנכס.",
                submitText: "אישור ומעבר לשאלה הבאה"
            },
            {
                id: 3,
                category: "שלב סיכום",
                heroTitle: "כאן שאלה ג' (כותרת בהירו)",
                type: "options",
                aiHint: "טיפ מ-AI עבור שלב הסיכום: כל אינטראקציה כאן מתועדת במערכת KOSUN.",
                answers: [
                    { id: 'c1', text: "כאן אפשרות סיום ראשונה", icon: "📊" },
                    { id: 'c2', text: "כאן אפשרות סיום שנייה", icon: "🔒" },
                    { id: 'c3', text: "כאן אפשרות סיום שלישית", icon: "🌐" }
                ]
            }
        ];

        let currentStepIndex = 0;

        // רינדור השלב הנוכחי
        function renderCurrentStep() {
            const data = questionnaireData[currentStepIndex];

            // עדכון כותרות ההירו
            document.getElementById('stepBadge').textContent = `שלב ${currentStepIndex + 1} מתוך ${questionnaireData.length}`;
            document.getElementById('heroSub').textContent = `[${data.category}]`;
            document.getElementById('heroQuestion').textContent = data.heroTitle;
            document.getElementById('aiHintText').textContent = data.aiHint;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            // מקרה 1: שאלת אפשרויות (שורה תחת שורה)
            if (data.type === 'options') {
                data.answers.forEach((ans) => {
                    const btn = document.createElement('button');
                    btn.className = `w-full h-14 sm:h-16 px-4 rounded-2xl bg-[#0D0E1F]/80 border border-white/15 hover:border-cyan-400/80 active:scale-95 transition-all flex items-center justify-between text-right shadow-sm group backdrop-blur-md`;
                    btn.onclick = (e) => handleOptionSelected(btn, ans.text);

                    btn.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden">
                            <span class="text-base sm:text-lg shrink-0">${ans.icon}</span>
                            <span class="text-base sm:text-lg font-semibold text-white/90 group-hover:text-cyan-300 truncate-single">
                                ${ans.text}
                            </span>
                        </div>
                        <div class="w-2.5 h-2.5 rounded-full border border-cyan-400/50 group-hover:bg-cyan-400 shrink-0 mr-2 transition-colors"></div>
                    `;
                    container.appendChild(btn);
                });
            }
            // מקרה 2: שדה פתוח
            else if (data.type === 'open_field') {
                const wrapper = document.createElement('div');
                wrapper.className = "flex flex-col gap-3 w-full";

                wrapper.innerHTML = `
                    <div class="relative w-full">
                        <input id="openInputField" type="text" placeholder="${data.placeholder}" 
                            class="w-full h-14 sm:h-16 px-5 rounded-2xl bg-[#0D0E1F]/90 border border-cyan-400/40 focus:border-cyan-400 focus:outline-none text-white text-base sm:text-lg shadow-inner placeholder-white/30 truncate-single" />
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-cyan-400/60 text-sm">⌨️</span>
                    </div>
                    <button id="submitFieldBtn" class="w-full h-12 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 font-bold text-sm sm:text-base shadow-lg hover:brightness-110 active:scale-95 transition-all">
                        ${data.submitText}
                    </button>
                `;
                container.appendChild(wrapper);

                const inputEl = document.getElementById('openInputField');
                const submitBtn = document.getElementById('submitFieldBtn');

                submitBtn.onclick = () => {
                    const value = inputEl.value.trim() || "תשובה פתוחה (הוזנה)";
                    handleOptionSelected(submitBtn, value);
                };
            }
        }

        /**
         * אפקט המעבר:
         * התשובה נמתחת למעלה, נצמדת להירו, והטקסט מתחלף לשאלה הבאה
         */
        function handleOptionSelected(targetElement, answerText) {
            const hero = document.getElementById('heroQuestion');
            const heroRect = hero.getBoundingClientRect();
            const targetRect = targetElement.getBoundingClientRect();

            // 1. יצירת אלמנט משוכפל שנמתח (Clone)
            const clone = targetElement.cloneNode(true);
            clone.classList.add('stretch-clone');
            clone.style.top = `${targetRect.top}px`;
            clone.style.left = `${targetRect.left}px`;
            clone.style.width = `${targetRect.width}px`;
            clone.style.height = `${targetRect.height}px`;
            clone.style.margin = '0';
            document.body.appendChild(clone);

            // 2. העלמת האפשרויות האחרות
            document.getElementById('optionsContainer').style.opacity = '0';

            // 3. הנפשת המתיחה וההיצמדות להירו
            requestAnimationFrame(() => {
                clone.style.top = `${heroRect.top - 6}px`;
                clone.style.left = `${heroRect.left}px`;
                clone.style.width = `${heroRect.width}px`;
                clone.style.height = `${heroRect.height + 12}px`;
                clone.style.opacity = '0.9';
            });

            // 4. החלפת תוכן ההירו והמשך לשלב הבא
            setTimeout(() => {
                clone.style.opacity = '0';
                clone.style.transform = 'scale(1.05)';

                setTimeout(() => {
                    clone.remove();
                    currentStepIndex++;

                    if (currentStepIndex < questionnaireData.length) {
                        renderCurrentStep();
                        document.getElementById('optionsContainer').style.opacity = '1';
                    } else {
                        showCompletionScreen();
                    }
                }, 200);
            }, 550);
        }

        // מסך סיום השאלון
        function showCompletionScreen() {
            document.getElementById('stepBadge').textContent = "הושלם בהצלחה";
            document.getElementById('heroSub').textContent = "INTERACTIONS INTO ASSETS";
            document.getElementById('heroQuestion').textContent = "השאלון הושלם! כל הנתונים הפכו לנכס.";
            document.getElementById('optionsContainer').innerHTML = `
                <div class="p-6 rounded-3xl bg-[#0D0E1F]/90 border border-cyan-400 text-center shadow-2xl">
                    <p class="text-white/80 text-sm mb-4">האינטראקציה שלך נשמרה במערכת KOSUN.</p>
                    <button onclick="location.reload()" class="w-full py-3 rounded-xl bg-cyan-400 text-slate-950 font-bold text-sm">
                        התחל שאלון מחדש
                    </button>
                </div>
            `;
            document.getElementById('optionsContainer').style.opacity = '1';
        }

        // ניהול מגירת ה-AI
        function toggleAiDrawer() {
            const drawer = document.getElementById('aiDrawer');
            drawer.classList.toggle('translate-y-full');
        }

        // מודל יציאה
        function triggerExitPrompt() {
            document.getElementById('exitModal').classList.remove('hidden');
        }
        function closeExitModal() {
            document.getElementById('exitModal').classList.add('hidden');
        }

        // אתחול
        window.onload = renderCurrentStep;
    </script>
</body>

</html>
